apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - {{ .Values.mariadb.storage.accessMode }}
  resources:
    requests:
      storage: {{ .Values.mariadb.storage.size }}
  {{- with .Values.mariadb.storage.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
