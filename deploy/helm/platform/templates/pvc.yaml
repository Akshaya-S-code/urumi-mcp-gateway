{{- if and .Values.persistence.enabled .Values.persistence.createClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ required "persistence.existingClaim is required when persistence.enabled" .Values.persistence.existingClaim }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
