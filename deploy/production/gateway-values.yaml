replicaCount: 1
image:
  repository: registry.example.com/urumi/gateway
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3002
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: gateway.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: urumi-tls
      hosts: [gateway.example.com]
env:
  - name: PORT
    value: "3002"
  - name: CORS_ORIGINS
    value: "https://dashboard.example.com"
  - name: WOO_MCP_URL
    value: "http://urumi-woo-mcp-platform:3001/mcp"
  - name: ANALYTICS_MCP_URL
    value: "http://urumi-analytics-mcp-platform:3003/mcp"
  - name: INVENTORY_MCP_URL
    value: "http://urumi-inventory-mcp-platform:3004/mcp"
  - name: URUMI_GATEWAY_API_KEY
    valueFrom:
      secretKeyRef: { name: urumi-app-secrets, key: URUMI_GATEWAY_API_KEY }
  - name: UPSTREAM_CREDENTIALS_ENCRYPTION_KEY
    valueFrom:
      secretKeyRef: { name: urumi-app-secrets, key: UPSTREAM_CREDENTIALS_ENCRYPTION_KEY }
  - name: OLLAMA_BASE_URL
    value: "http://ollama.urumi.svc.cluster.local:11434"
  - name: OLLAMA_MODEL
    value: "qwen2.5:3b"
  - name: UPSTREAM_TIMEOUT_MS
    value: "8000"
  - name: TOOL_CALL_TIMEOUT_MS
    value: "45000"
  - name: UPSTREAM_ALLOWED_HOSTS
    value: "urumi-woo-mcp-platform,urumi-analytics-mcp-platform,urumi-inventory-mcp-platform"
  - name: CHAT_TIMEOUT_MS
    value: "60000"
livenessProbe:
  httpGet: { path: /health, port: http }
  initialDelaySeconds: 20
  periodSeconds: 10
readinessProbe:
  httpGet: { path: /health, port: http }
  initialDelaySeconds: 10
  periodSeconds: 5
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }
volumeMounts:
  - name: gateway-data
    mountPath: /app/services/gateway/data
volumes:
  - name: gateway-data
    persistentVolumeClaim:
      claimName: urumi-gateway-data
persistence:
  enabled: true
  existingClaim: urumi-gateway-data
  size: 5Gi
  accessMode: ReadWriteOnce
  storageClassName: local-path
