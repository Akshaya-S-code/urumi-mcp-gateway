replicaCount: 1
image:
  repository: urumi-woo-mcp
  tag: local
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3001
env:
  - name: PORT
    value: "3001"
  - name: WOOCOMMERCE_URL
    value: "http://store.urumi.local"
  - name: WOOCOMMERCE_CONNECT_URL
    value: "http://wordpress.urumi-store.svc.cluster.local"
  - name: WOOCOMMERCE_CONSUMER_KEY
    valueFrom:
      secretKeyRef:
        name: urumi-app-secrets
        key: WOOCOMMERCE_CONSUMER_KEY
  - name: WOOCOMMERCE_CONSUMER_SECRET
    valueFrom:
      secretKeyRef:
        name: urumi-app-secrets
        key: WOOCOMMERCE_CONSUMER_SECRET
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
networkPolicy:
  enabled: true
  allowedFromLabels:
    app.kubernetes.io/instance: urumi-gateway
