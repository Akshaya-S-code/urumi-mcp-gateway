replicaCount: 1
image:
  repository: urumi-dashboard
  tag: local
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: dashboard.urumi.local
      paths:
        - path: /
          pathType: Prefix
